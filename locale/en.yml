ernestdefoe-marquee:
  admin:
    tmdb_token_label: TMDB API read access token
    tmdb_token_help: "Movies and TV shows come from The Movie Database. <a>Get a token from your TMDB API settings</a> and paste the long API Read Access Token here. It stays on the server."
    language_label: Data language
    language_help: "The language TMDB returns titles and synopses in, as a language and region code such as en-US, fr-FR or pt-BR."
    tags_label: Which tags use which source
    tags_help: "When someone starts a discussion under one of these tags, the title field searches that source and the discussion shows the title's card in its header. Every other tag keeps the normal composer."
    source_none: Normal discussion
    source_movie: Movies (TMDB)
    source_tv: TV shows (TMDB)
    source_game: Games (IGDB, needs keys)

  api:
    link_invalid: That title could not be linked. Pick it again from the list.
    link_unavailable: The title source could not be reached, so the title was not linked. Try again in a moment.

  forum:
    kind:
      movie: Movie
      tv: TV
      game: Game

    picker:
      placeholder_movie: Search for a movie by title
      placeholder_tv: Search for a TV show by title
      placeholder_game: Search for a game by title
      results_from: "Results from {source}"
      escape_hint: Esc keeps a plain title
      unavailable: "{source} is not answering right now. You can still post with a plain title."

    composer:
      linked: "Linked to {title} · {source}"
      remove_link: Remove the link

    scope:
      season_label: Season
      episode_label: Episode
      whole_show: Whole show
      whole_season: Whole season
      loading: Loading episodes…
      season_option: "Season {number} ({year})"
      episode_option: "E{number} · {title}"

    title:
      season: "{base} Season {number}"
      episode: "{base} S{season}E{episode}: {name}"

    meta:
      runtime_hours: "{hours}h {minutes}m"
      runtime_minutes: "{minutes}m"
      seasons_count: "{count, plural, one {# season} other {# seasons}}"
      episodes_count: "{count, plural, one {# episode} other {# episodes}}"
      season_episode: "Season {season}, Episode {episode}"

    credits:
      director: Director
      writer: Screenplay
      based_on: Based on
      creator: Created by
      network: Network
      status: Status
      directed_by: Directed by
      written_by: Written by

    hero:
      user_score: TMDB user score
      season_score: TMDB season score
      episode_score: TMDB episode score
      cast: Cast
      guest_stars: Guest stars
      seasons: Seasons
      season_failed: This season could not be loaded right now.
      view_on: "View on {source}"
      trailer: Trailer
      episode_details: Episode details
      discuss_show: Discuss the whole show
      attribution_tmdb: Data and images from TMDB. Not endorsed or certified by TMDB.
      attribution_igdb: Game data from IGDB.com

    modal:
      title: "S{season} · E{episode}  {name}"
      badge: "{title} · Season {season}, Episode {episode}"
      score: "{score}% on TMDB"
      previous: Previous
      next: Next
      discuss_episode: Discuss this episode

    list:
      season: "Season {number}"
      episode: "S{season}E{episode}"
